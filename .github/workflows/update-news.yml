
name: Update public news feeds
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Recopilación manual · {0}', inputs.request_id || github.run_id) || format('SENTINEL · {0}', github.event_name) }}

on:
  push:
    branches: [main]
    paths-ignore:
      - 'data/news.json'
      - '**.md'
  workflow_dispatch:
    inputs:
      request_id:
        description: Identificador opcional de la solicitud desde SENTINEL
        type: string
        required: false
  schedule:
    - cron: "11,26,41,56 * * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sentinel-publish
  cancel-in-progress: false

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      due: ${{ steps.freshness.outputs.due }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check collection freshness
        id: freshness
        run: python scripts/check_update.py

      - name: Explain skipped check
        if: steps.freshness.outputs.due != 'true'
        run: echo "Datos recientes. La próxima comprobación volverá a evaluar la recopilación." >> "$GITHUB_STEP_SUMMARY"

      - name: Collect news
        if: steps.freshness.outputs.due == 'true'
        env:
          SENTINEL_REQUEST_ID: ${{ inputs.request_id }}
        run: |
          for attempt in 1 2 3; do
            if python scripts/fetch.py --require-success; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then sleep 8; fi
          done
          echo "No source could be collected after three attempts." >&2
          exit 1

      - name: Validate collector and data
        if: steps.freshness.outputs.due == 'true'
        run: python -m unittest discover -s tests -v

      - name: Validate frontend syntax and filtering
        if: steps.freshness.outputs.due == 'true'
        run: node --test tests/*.test.cjs

      - name: Commit updated data
        if: steps.freshness.outputs.due == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if ! git diff --cached --quiet; then
            git commit -m "Update SENTINEL news data"
            git push
          fi

      - name: Configure GitHub Pages
        if: steps.freshness.outputs.due == 'true'
        uses: actions/configure-pages@v5

      - name: Prepare public files only
        if: steps.freshness.outputs.due == 'true'
        run: |
          mkdir -p _site/data
          cp index.html _site/
          cp -r assets _site/
          cp data/news.json _site/data/
          touch _site/.nojekyll

      - name: Upload site
        if: steps.freshness.outputs.due == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: update-news
    if: needs.update-news.outputs.due == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
